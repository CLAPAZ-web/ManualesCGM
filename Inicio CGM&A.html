<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMPRESAS · CGM&amp;A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: cabecera con logo + migas de pan; tres niveles (áreas > unidades > empresa) en tarjetas; la empresa abre índice lateral + sección */
:root{
  color-scheme:dark;
  --fondo:#0b1f45; --tarjeta:#10285a; --tarjeta2:#163266; --linea:rgba(196,210,240,.18);
  --texto:#ffffff; --suave:#b9c6e2; --tenue:#7d8db0; --oro:#d9b66f;
  --display:"Libre Baskerville",Baskerville,Georgia,"Times New Roman",serif;
  --cuerpo:"Inter","Segoe UI",Calibri,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--cuerpo);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

header .wrap{display:flex;align-items:center;gap:28px;padding-block:30px 26px;border-bottom:1px solid var(--linea);flex-wrap:wrap}
.logo{height:106px;width:auto;display:block;cursor:pointer}
.marca{font-size:.95rem;letter-spacing:.22em;color:var(--suave);text-transform:uppercase;align-self:flex-start;margin-top:40px}

main{padding-block:26px 56px}
.migas{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.95rem;color:var(--suave);margin-bottom:18px}
.migas a{color:var(--texto);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.55)}
.migas a:hover{text-decoration-color:var(--oro)}
.migas .sep{color:var(--tenue)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,4.5vw,2.75rem);line-height:1.1;margin:0 0 10px;text-wrap:balance}
.intro{color:var(--suave);font-size:1.08rem;max-width:62ch;margin:0 0 30px}

/* Tarjetas de áreas / unidades / empresas */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:26px 26px 24px;color:inherit;text-decoration:none;text-align:left;font:inherit;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.card:hover{background:var(--tarjeta2);border-color:rgba(217,182,111,.55);transform:translateY(-2px)}
.card:focus-visible,.indice button:focus-visible,.migas a:focus-visible,.btn:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
.card h3{font-family:var(--display);font-weight:700;font-size:1.55rem;margin:4px 0 0;letter-spacing:.01em}
.card p{margin:0;color:var(--suave)}
.card .pie{margin-top:8px;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);font-weight:500}
.card .ico{width:38px;height:38px;color:var(--oro);margin-bottom:10px}
.card.prox{cursor:default;opacity:.55}
.card.prox:hover{background:var(--tarjeta);border-color:var(--linea);transform:none}
.card.prox .pie{color:var(--tenue)}

/* Página de empresa */
.manual{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.lateral{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:18px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.ficha{display:grid;gap:12px;border:1px solid var(--linea);border-radius:12px;padding:16px;background:var(--tarjeta2);margin-bottom:20px}
.ficha .dato+.dato{border-top:1px solid var(--linea);padding-top:12px}
.ficha .lbl{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.ficha .val{font-size:1.05rem;font-weight:600;margin-top:2px}
.ficha .val.vacio{color:var(--tenue);font-weight:400;font-style:italic}
.indice .tit{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);margin:0 2px 12px}
.indice .grupo{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);margin:16px 2px 6px}
.indice button{display:flex;gap:14px;width:100%;background:none;border:0;border-left:3px solid transparent;color:var(--texto);font:inherit;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer}
.indice button span{color:var(--suave);font-variant-numeric:tabular-nums;min-width:24px}
.indice button.prox{color:var(--suave)}
.indice button em{margin-left:auto;font-style:normal;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);align-self:center}
.indice button:hover{background:rgba(255,255,255,.05)}
.indice button.on{background:#2a4277;border-left-color:var(--oro)}
.seccion{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:30px 30px 34px;min-height:340px}
.seccion .eyebrow{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--oro)}
.seccion h2{font-family:var(--display);font-weight:700;font-size:2rem;margin:6px 0 12px;line-height:1.15}
.seccion .bajada{color:var(--suave);font-size:1.05rem;margin:0 0 22px;max-width:65ch}
.pendiente{border:1px dashed var(--linea);border-radius:10px;padding:16px 18px;color:var(--suave)}
.cuerpo{max-width:68ch}
.nav-sec{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{background:none;border:1px solid var(--linea);color:var(--texto);font:inherit;font-size:.92rem;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--oro)}
.btn[disabled]{opacity:.35;cursor:default}
.abrir{display:inline-flex;margin-bottom:22px}

footer .wrap{border-top:1px solid var(--linea);padding-block:18px 28px;color:var(--suave);font-size:.9rem}
.aviso{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--fondo);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:20}

@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.manual{grid-template-columns:minmax(0,1fr)}.lateral{position:static}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}.logo{height:78px}.marca{margin-top:0}.seccion{padding:22px 18px}}
</style>
</head>

  tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  mano:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l2 2a1.4 1.4 0 0 0 2-2"/><path d="M14 14l2.5 2.5a1.4 1.4 0 0 0 2-2l-3.9-3.9a3 3 0 0 0-4.2 0l-.9.9a1.4 1.4 0 0 1-2-2l2.8-2.8a5 5 0 0 1 5.6-1L21 7.5"/><path d="M3 7.5l3-1.5 6 6"/><path d="M3 13l3.5 3.5"/></svg>',
  carpeta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 11h18"/></svg>',
};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural=(n,s,p)=>n+" "+(n===1?s:p);
let seccionActual="1.1";

function ir(token){ if(location.hash.slice(1)===token) render(); else location.hash=token; }
function miga(lista){
  return '<nav class="migas" aria-label="Ubicación">'+lista.map((m,i)=>
    i<lista.length-1?`<a href="#${m[1]}">${esc(m[0])}</a><span class="sep">›</span>`:`<span>${esc(m[0])}</span>`).join("")+'</nav>';
}

function vistaInicio(){
  return miga([["Inicio","inicio"]])+
  `<h1>EMPRESAS</h1><p class="intro">En este apartado se recopila toda la información relevante sobre las empresas de CGM&amp;A: manuales, pautas de carga, pautas administrativas e información comercial. Elegí el área de trabajo para empezar.</p>
  <div class="grid">`+ESTRUCTURA.map(a=>{
    const pie=a.proximamente?"Próximamente":plural(a.unidades.length,"unidad","unidades");
    const cuerpo=`<div class="ico">${ICONOS[a.icono]||""}</div><h3>${esc(a.nombre.toUpperCase())}</h3><p>${esc(a.desc)}</p><span class="pie">${pie}</span>`;
    return a.proximamente?`<div class="card prox">${cuerpo}</div>`:`<a class="card" href="#${a.id}">${cuerpo}</a>`;
  }).join("")+`</div>`;
}

function vistaArea(a){
  return miga([["Inicio","inicio"],[a.nombre,a.id]])+
  `<h1>${esc(a.nombre)}</h1><p class="intro">${esc(a.intro||a.desc)}</p><div class="grid">`+
  a.unidades.map(u=>{
    const n=u.empresas.length;
    return `<a class="card" href="#${a.id}-${u.id}"><h3>${esc(u.nombre)}</h3>
      <p>${n?u.empresas.map(e=>esc(e.nombre)).join(" · "):"Empresas por cargar"}</p>
      <span class="pie">${plural(n,"empresa","empresas")}</span></a>`;
  }).join("")+`</div>`;
}

function vistaUnidad(a,u){
  const n=u.empresas.length;
  return miga([["Inicio","inicio"],[a.nombre,a.id],[u.nombre,a.id+"-"+u.id]])+
  `<h1>${esc(u.nombre)}</h1><p class="intro">${n?"Elegí la empresa cliente para abrir su manual.":"Todavía no hay empresas cargadas en esta unidad."}</p>`+
  (n?`<div class="grid">`+u.empresas.map(e=>`<a class="card" href="#${a.id}-${u.id}-${e.id}"><h3>${esc(e.nombre)}</h3>
      <p>${CONTENIDO[e.id]&&Object.keys(CONTENIDO[e.id]).length?"Manual en curso":"Manual por adaptar"}</p>
      <span class="pie">${PLANTILLA.reduce((t,g)=>t+g.items.length,0)} secciones</span></a>`).join("")+`</div>`:"");
}

function ficha(u,e){
  const fila=(l,v)=>`<div class="dato"><div class="lbl">${l}</div><div class="val${v?"":" vacio"}">${esc(v||"A definir")}</div></div>`;
  return `<div class="ficha">${fila("Unidad",u.titulo||u.nombre)}${fila("Equipo",e.equipo)}${fila("Referente operativo",e.referente)}${fila("Líder operativo",e.lider)}</div>`;
}

function vistaEmpresa(a,u,e){
  const items=PLANTILLA.flatMap(g=>g.items);
  if(!items.some(i=>i[0]===seccionActual)) seccionActual=items[0][0];
  const idx=items.findIndex(i=>i[0]===seccionActual), it=items[idx];
  const t=s=>s.replace(/\{EMPRESA\}/g,e.nombre);
  const texto=(CONTENIDO[e.id]||{})[it[0]];
  return miga([["Inicio","inicio"],[a.nombre,a.id],[u.nombre,a.id+"-"+u.id],[e.nombre,""]])+
  `<h1>${esc(e.nombre)}</h1><p class="intro">Unidad ${esc(u.nombre)} · ${esc(e.bajada||"Manual de gestión de la empresa, armado sobre la plantilla común.")}</p>
  <div class="manual">
    <aside class="lateral">${ficha(u,e)}
      <div class="indice"><div class="tit">Contenido</div>`+
      PLANTILLA.map(g=>`<div class="grupo">${g.n} · ${esc(g.grupo)}</div>`+
        g.items.map(i=>`<button class="${i[0]===seccionActual?"on":""}${g.proximamente?" prox":""}" data-sec="${i[0]}"><span>${i[0]}</span>${esc(t(i[1]))}${g.proximamente?'<em>Próximamente</em>':""}</button>`).join("")).join("")+
      `</div></aside>
    <article class="seccion">
      ${e.manual?`<button class="btn abrir" id="abrir">Abrir manual completo →</button>`:""}
      <div class="eyebrow">${it[0]} · ${esc(PLANTILLA.find(g=>g.items.includes(it)).grupo)}</div>
      <h2>${esc(t(it[1]))}</h2>
      <p class="bajada">${esc(t(it[2]))}</p>
      ${texto?`<div class="cuerpo">${texto}</div>`:`<div class="pendiente">${PLANTILLA.find(g=>g.items.includes(it)).proximamente?"Esta sección se va a completar próximamente.":"Aquí va el contenido de la sección adaptado a "+esc(e.nombre)+"."}</div>`}
      <div class="nav-sec">
        <button class="btn" data-sec="${idx>0?items[idx-1][0]:""}" ${idx>0?"":"disabled"}>← ${idx>0?esc(t(items[idx-1][1])):"Anterior"}</button>
        <button class="btn" data-sec="${idx<items.length-1?items[idx+1][0]:""}" ${idx<items.length-1?"":"disabled"}>${idx<items.length-1?esc(t(items[idx+1][1])):"Siguiente"} →</button>
      </div>
    </article>
  </div>`;
}

function render(){
  const [ai,ui,ei]=(location.hash.slice(1)||"inicio").split("-");
  const a=ESTRUCTURA.find(x=>x.id===ai&&!x.proximamente);
  const u=a&&a.unidades.find(x=>x.id===ui);
  const e=u&&u.empresas.find(x=>x.id===ei);
  $("app").innerHTML= e?vistaEmpresa(a,u,e): u?vistaUnidad(a,u): a?vistaArea(a): vistaInicio();
  const ab=$("abrir"); if(ab) ab.onclick=()=>abrirManual(e);
  document.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{ if(!b.dataset.sec)return; seccionActual=b.dataset.sec; render();
    if(innerWidth<=900) document.querySelector(".seccion").scrollIntoView({behavior:"smooth",block:"start"}); });
}
function abrirManual(e){
  if(location.protocol==="file:"){ location.href=encodeURI(e.manual); return; }
  const t=$("aviso"); t.textContent="Vista previa: el manual completo se abre desde la carpeta en tu PC."; t.hidden=false;
  clearTimeout(t._x); t._x=setTimeout(()=>t.hidden=true,3200);
}
$("logo").onclick=()=>ir("inicio");
addEventListener("hashchange",()=>{seccionActual="1.1";render();scrollTo(0,0)});
render();
</script>
</body>
</html>
